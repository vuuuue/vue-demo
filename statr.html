  // 1.简单的响应式数据
  // 2.非其固定命名的副作用函数
  // 3.更改没有依赖的键也会执行，对对象和键添加依赖的响应式数据
  // 4.effect的嵌套问题
  // 5.effect的无限循环
  // 6.调度与使用调度进行次数控制（类似修改响应式数据但只会触发一次更新）
  // 7.通过lazy实现非立即运行effect
  // 8.通过lazy实现commputed
  // 9.为computed添加缓存功能
  // 10.effect内嵌的computed
  // 11.watch
  // 12.获取watch的旧值和新值

  let activeEffect = undefined;
  let effectStack = []
  // 定义一个任务队列
  let jobQueue = new Set()
  let flushing = false
  let p = Promise.resolve()
  function jobFlush() {
    if (flushing) return
    flushing = true
    p.then(() => {
      jobQueue.forEach(fn => {
        fn()
      })
    }).finally(() => {
      flushing = false
    })

  }
  const data = {
    foo: 1,
    bar: 2
  }
  function effect(fn, options = {}) {
    const effectFn = function () {
      clearup(effectFn)
      activeEffect = effectFn
      effectStack.push(effectFn)
      let res = fn()
      effectStack.pop()
      activeEffect = effectStack[effectStack.length - 1];
      return res
    }
    effectFn.deps = []
    effectFn.options = options
    if (!options.lazy) {
      effectFn()
    }
    return effectFn
  }
  function clearup(effectFn) {
    let deps = effectFn.deps
    for (let i = 0; i < deps.length; i++) {
      deps[i].delete(effectFn)
    }
    deps.length = 0
  }
  // 创建一个有依赖关系的桶
  // WeakMap 对 key 是弱引用，不影响垃圾回收器的工
  // 作。据这个特性可知，一旦 key 被垃圾回收器回收，那么对应的键和
  // 值就访问不到了。所以 WeakMap 经常用于存储那些只有当 key 所引
  // 用的对象存在时（没有被回收）才有价值的信息，如果对象没有任何引用了，说明用户侧不再需要它了，
  // 这时垃圾回收器会完成回收任务。但如果使用 Map 来代替 WeakMap，
  // 那么即使用户侧的代码对 target 没有没有任何引用，这个 target 也不
  // 会被回收，最终可能导致内存溢出
  const bucket = new WeakMap()
  const obj = new Proxy(data, {
    get(target, key) {
      track(target, key)
      return target[key]
    },
    set(target, key, newValue) {
      target[key] = newValue
      trigger(target, key)
    }
  })

  function track(target, key) {
    if (!activeEffect) return
    let depsMap = bucket.get(target)
    if (!depsMap) {
      bucket.set(target, depsMap = new Map())
    }
    let deps = depsMap.get(key)
    if (!deps) {
      depsMap.set(key, deps = new Set())
    }
    deps.add(activeEffect)
    activeEffect.deps.push(deps)
  }
  function trigger(target, key) {
    let depsMap = bucket.get(target)
    if (!depsMap) return
    let deps = depsMap.get(key)
    if (!deps) return
    // deps.forEach(fn => fn())
    const depsToRun = new Set(deps)
    depsToRun.forEach(fn => {
      if (fn !== activeEffect) {
        if (fn.options.scheduler) {
          fn.options.scheduler(fn)
        } else {
          fn()
        }
      }
    })
  }

  function computed(getter) {
    let value;
    let dirty = true
    const effectFn = effect(getter, {
      scheduler() {
        dirty = true
        trigger(obj, 'value')
      }, lazy: true
    })
    let obj = {
      get value() {
        track(obj, 'value')
        if (dirty) {
          value = effectFn()
          dirty = false
          return value
        }
        return value
      }
    }
    return obj
  }

  const sumRes = computed(() => {
    return obj.foo + obj.bar
  }
  )

  function watch(v, cb) {
    let getter;
    if (typeof v === 'function') {
      getter = v
    } else {
      getter = () => t(v)
    }
    let oldV, newV
    const effectFn = effect(getter, {
      lazy: true,
      scheduler(eff) {
        newV = eff()
        cb(newV, oldV)
        oldV = newV
      }
    })
    oldV = effectFn()
  }
  function t(source, seen = new Set()) {
    if (source === null || typeof source !== 'object' || seen.has(source)) return;
    seen.add(source)

    for (let k in source) {
      t(source[k], seen)
    }
    return source
  }
  watch(() => obj.foo, (n, o) => {
